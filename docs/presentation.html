document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rence) {\n      [data-deck-active] .sl > * {\n        opacity: 0;\n        animation: rise .6s cubic-bezier(.22,.85,.25,1) both;\n      }\n      [data-deck-active] .sl > *:nth-child(1){ animation-delay:.04s }\n      [data-deck-active] .sl > *:nth-child(2){ animation-delay:.13s }\n      [data-deck-active] .sl > *:nth-child(3){ animation-delay:.22s }\n      [data-deck-active] .sl > *:nth-child(4){ animation-delay:.31s }\n      [data-deck-active] .sl > *:nth-child(5){ animation-delay:.40s }\n      [data-deck-active] .sl > *:nth-child(6){ animation-delay:.49s }\n      [data-deck-active] .sl > *:nth-child(7){ animation-delay:.58s }\n      /* nested micro-stagger for list items & cards */\n      [data-deck-active] .stagger > * {\n        opacity: 0;\n        animation: rise .55s cubic-bezier(.22,.85,.25,1) both;\n      }\n      [data-deck-active] .stagger > *:nth-child(1){ animation-delay:.30s }\n      [data-deck-active] .stagger > *:nth-child(2){ animation-delay:.40s }\n      [data-deck-active] .stagger > *:nth-child(3){ animation-delay:.50s }\n      [data-deck-active] .stagger > *:nth-child(4){ animation-delay:.60s }\n      [data-deck-active] .stagger > *:nth-child(5){ animation-delay:.70s }\n    }\n\n    /* shared slide shell */\n    .sl {\n      display: flex; flex-direction: column;\n      padding: var(--py) var(--px);\n      width: 100%; height: 100%;\n      box-sizing: border-box;\n      font-family: 'Geologica', 'Segoe UI', system-ui, sans-serif;\n    }\n    /* ── single clean dark theme: deep teal-green gradient base with bright\n         drifting mint + cyan glows for a fresh, premium feel ── */\n    .sl-dark, .sl-mid, .sl-light {\n      color: #EAF6EC;\n      background:\n        radial-gradient(58% 80% at 12% 6%, rgba(61,228,137,.18), transparent 62%),\n        radial-gradient(56% 80% at 94% 102%, rgba(24,224,212,.20), transparent 60%),\n        radial-gradient(46% 58% at 102% -2%, rgba(43,176,255,.12), transparent 60%),\n        linear-gradient(158deg, #08291E 0%, #051C25 56%, #061A2C 100%);\n      background-size: 165% 165%, 178% 178%, 150% 150%, 100% 100%;\n      background-position: 0% 0%, 100% 100%, 100% 0%, 0 0;\n    }\n    @media (prefers-reduced-motion: no-preference) {\n      [data-deck-active] .sl-dark,\n      [data-deck-active] .sl-mid,\n      [data-deck-active] .sl-light {\n        animation: bgdrift 24s ease-in-out infinite alternate;\n      }\n    }\n    @keyframes bgdrift {\n      to { background-position: 38% 28%, 62% 72%, 55% 32%, 0 0; }\n    }\n\n    /* gradient shimmer headline (cover + closing) */\n    .grad-text {\n      background: linear-gradient(100deg, #EAF6EC 0%, #3DE489 42%, #18E0D4 64%, #EAF6EC 100%);\n      background-size: 230% 100%;\n      -webkit-background-clip: text; background-clip: text;\n      -webkit-text-fill-color: transparent; color: transparent;\n    }\n    @media (prefers-reduced-motion: no-preference) {\n      [data-deck-active] .grad-text { animation: shimmer 7s ease-in-out infinite; }\n      [data-deck-active] .kicker-dot { animation: dotpulse 2.6s ease-in-out infinite; }\n    }\n    @keyframes shimmer { 0%,100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }\n    @keyframes dotpulse {\n      0%,100% { box-shadow: 0 0 0 0 rgba(61,228,137,.55); }\n      55%     { box-shadow: 0 0 0 9px rgba(61,228,137,0); }\n    }\n\n    /* kicker */\n    .kicker { display:flex; align-items:center; gap:14px; margin-bottom:24px; }\n    .kicker-dot { width:12px; height:12px; border-radius:50%;\n      background: linear-gradient(135deg, var(--green), var(--teal)); flex-shrink:0; }\n    .kicker-text { font-size:var(--t-kicker); font-weight:700; letter-spacing:.14em;\n      text-transform:uppercase; color:var(--bright); }\n    .kicker-text-light { color: var(--bright); }\n\n    /* headings */\n    .h2 { font-size:var(--t-h2); font-weight:800; line-height:1.1; color:#EAF6EC; }\n    .h2-light { color: #EAF6EC; }\n\n    /* body text */\n    .body { font-size:var(--t-body); line-height:1.55; color:rgba(223,242,226,.86); }\n    .body-light { color:rgba(223,242,226,.86); }\n    .lead { font-size:var(--t-lead); line-height:1.45; color:rgba(223,242,226,.9); }\n    .lead-light { color:rgba(223,242,226,.9); }\n\n    /* bullet list */\n    .bullets { list-style:none; display:flex; flex-direction:column; gap:var(--gap-sm); }\n    .bullet { display:flex; gap:20px; align-items:flex-start; }\n    .bullet-dot { flex-shrink:0; width:14px; height:14px; border-radius:5px; margin-top:11px;\n      background:linear-gradient(135deg, var(--green), var(--teal)); }\n    .bullet-dot-light { background:linear-gradient(135deg, var(--teal), var(--yellow)); }\n    .bullet-text { font-size:var(--t-list); line-height:1.45; color:rgba(223,242,226,.9); }\n    .bullet-text b { color: var(--bright); }\n    .bullet-text-light { color:rgba(220,242,224,.9); }\n    .bullet-text-light b { color: #8FE5A8; }\n\n    /* card */\n    .card { background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.12); border-radius:var(--radius);\n      padding:36px 40px; box-shadow:none; transition:transform .28s cubic-bezier(.22,.85,.25,1), border-color .28s ease, background .28s ease; }\n    .card:hover { transform:translateY(-6px); border-color:rgba(61,228,137,.4); background:rgba(255,255,255,.085); }\n    .card-dark { background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.12); border-radius:var(--radius); padding:36px 40px; }\n    .card h3 { font-size:36px; font-weight:800; color:#EAF6EC; margin-bottom:18px; }\n    .card-dark h3 { color:#E8F5EA; }\n\n    /* pipeline step */\n    .pipe { display:flex; align-items:center; justify-content:center; gap:9px; flex-wrap:wrap; }\n    .pipe-step { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); border-radius:12px;\n      padding:15px 17px; font-size:24px; font-weight:700; color:#EAF6EC; box-shadow:none; white-space:nowrap; }\n    .pipe-step-green { background:linear-gradient(135deg,#22C24E,#10A88E);\n      color:#fff; border:none; border-radius:12px; padding:15px 17px; font-size:24px; font-weight:700; white-space:nowrap; box-shadow:0 6px 22px rgba(24,224,212,.22); }\n    .pipe-step-light { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);\n      border-radius:12px; padding:15px 17px; font-size:24px; font-weight:700; color:#E8F5EA; white-space:nowrap; }\n    .pipe-arr { font-size:24px; font-weight:800; color:var(--teal); }\n    .pipe-arr-light { color: var(--teal); }\n\n    /* code block */\n    pre.code {\n      background:var(--code-bg); border-radius:16px; padding:18px 22px;\n      font-family:'JetBrains Mono', 'Consolas', ui-monospace, monospace;\n      font-size:24px; line-height:1.42; border:1px solid #1A3520;\n      color:var(--code-val); overflow:hidden;\n    }\n    .code-cap { display:block; font-family:'Geologica',sans-serif; font-size:24px;\n      font-weight:700; letter-spacing:.04em; text-transform:uppercase;\n      color:var(--code-dim); margin-bottom:14px; }\n    .tok-k  { color:var(--code-key); }\n    .tok-s  { color:#C0E8C8; }\n    .tok-t  { color:#90BFAC; }\n    .tok-hl { color:var(--code-hl); font-weight:700; }\n\n    /* accent */\n    .acc { color:var(--bright); font-weight:700; }\n    .acc-light { color:#8FE5A8; font-weight:700; }\n\n    /* footer */\n    .footer { margin-top:auto; padding-top:var(--gap-md);\n      font-size:var(--t-small); font-weight:600; color:rgba(176,206,182,.5); }\n    .footer-light { color:rgba(180,210,185,.6); }\n\n    /* badge */\n    .badge { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:999px;\n      padding:14px 28px; font-size:28px; font-weight:700; color:#C8F0D0;\n      box-shadow:none; display:inline-block; }\n    .badge-dark { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);\n      border-radius:999px; padding:14px 28px; font-size:28px; font-weight:700; color:#C8F0D0; display:inline-block; }\n\n    /* icon circle */\n    .icon-circle { width:60px; height:60px; border-radius:16px; display:flex;\n      align-items:center; justify-content:center; flex-shrink:0;\n      background:linear-gradient(135deg,#2FD968,#18E0D4); box-shadow:0 8px 24px rgba(24,224,212,.28); }\n\n    /* demo step */\n    .dstep { display:flex; gap:24px; align-items:flex-start; background:rgba(255,255,255,.08);\n      border:1px solid rgba(255,255,255,.14); border-radius:18px; padding:26px 32px; }\n    .dstep-num { flex-shrink:0; width:52px; height:52px; border-radius:14px;\n      display:flex; align-items:center; justify-content:center;\n      font-weight:900; color:#06241A; font-size:26px;\n      background:linear-gradient(135deg,#3DE489,#18E0D4); box-shadow:0 6px 20px rgba(24,224,212,.25); }\n    .dstep-text { font-size:32px; line-height:1.45; color:rgba(220,242,224,.9); }\n    .dstep-text code { background:rgba(143,220,168,.15); color:#8FE5A8;\n      padding:3px 10px; border-radius:7px; font-family:'JetBrains Mono',monospace;\n      font-size:28px; font-weight:700; }\n\n    /* CTA box */\n    .cta { background:linear-gradient(135deg,#22C24E 0%,#0E9E7E 100%);\n      color:#fff; border-radius:24px; padding:44px 52px; box-shadow:0 18px 50px rgba(24,224,212,.24); }\n    .cta h3 { font-size:42px; font-weight:800; margin-bottom:14px; }\n    .cta p  { font-size:var(--t-body); opacity:.95; line-height:1.5; }\n\n    /* compare table */\n    table.cmp { border-collapse:collapse; width:100%;\n      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:16px; overflow:hidden; box-shadow:none; }\n    table.cmp th, table.cmp td { padding:22px 32px; text-align:left;\n      border-bottom:1px solid rgba(255,255,255,.1); font-size:32px; vertical-align:top; color:rgba(223,242,226,.9); }\n    table.cmp thead th { background:var(--green-deep); color:#fff; font-weight:800; font-size:30px; }\n    table.cmp td:first-child { font-weight:700; color:rgba(176,206,182,.7); width:200px; }\n    table.cmp tr:last-child td { border-bottom:none; }\n\n    /* safety bar */\n    .safety-bar { border-left:4px solid var(--yellow); padding-left:20px;\n      font-size:28px; color:rgba(200,230,205,.78); line-height:1.5; }\n    .safety-bar code { background:rgba(143,213,168,.16); color:#9BEAB4;\n      padding:2px 10px; border-radius:6px; font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- Sber SVG mark (hidden) -->\n<svg style=\"display:none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <symbol id=\"smark\" viewBox=\"0 0 100 100\">\n    <defs>\n      <linearGradient id=\"sg2\" x1=\"0\" y1=\"1\" x2=\"1\" y2=\"0\">\n        <stop offset=\"0\" stop-color=\"#0B6E2D\"><\u002Fstop>\n        <stop offset=\".45\" stop-color=\"#21A038\"><\u002Fstop>\n        <stop offset=\".75\" stop-color=\"#00C1B5\"><\u002Fstop>\n        <stop offset=\"1\" stop-color=\"#FBC02D\"><\u002Fstop>\n      <\u002FlinearGradient>\n    <\u002Fdefs>\n    <path fill=\"none\" stroke=\"url(#sg2)\" stroke-width=\"13\" stroke-linecap=\"round\" d=\"M85 50a35 35 0 1 1-12-26\"><\u002Fpath>\n    <path fill=\"url(#sg2)\" d=\"M50 31l34 8-30 19z\"><\u002Fpath>\n  <\u002Fsymbol>\n<\u002Fsvg>\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"0490e3f5-6ee0-461d-be06-b05d4818bc14#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n  <!-- ══════════════════════════════════════════════\n       01 · TITLE\n  ══════════════════════════════════════════════ -->\n  <section data-label=\"01 · Титул\" data-screen-label=\"01 · Титул\" data-speaker-notes=\"Добрый день! Сегодня — внутренний показ двух ИИ-инструментов для нагрузочного тестирования. 20 минут + вопросы.\">\n    <div class=\"sl sl-dark\" style=\"justify-content:space-between\">\n\n      <!-- top: logo -->\n      <div style=\"display:flex;align-items:center;gap:18px\">\n        <svg width=\"58\" height=\"58\" viewBox=\"0 0 100 100\"><use href=\"#smark\"><\u002Fuse><\u002Fsvg>\n        <span style=\"font-size:38px;font-weight:800;color:#E2F0E5;letter-spacing:-.01em\">Сбер<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- center: title block -->\n      <div style=\"display:flex;flex-direction:column;gap:var(--gap-md);max-width:1400px\">\n        <div class=\"kicker\">\n          <div class=\"kicker-dot\"><\u002Fdiv>\n          <span class=\"kicker-text kicker-text-light\">Внутренний показ · 20 минут<\u002Fspan>\n        <\u002Fdiv>\n        <h1 class=\"grad-text\" style=\"font-size:var(--t-title);font-weight:900;line-height:1.06\">\n          ИИ для инженеров<br>нагрузочного тестирования\n        <\u002Fh1>\n        <p class=\"lead lead-light\" style=\"max-width:1100px\">\n          Два инструмента, один подход: снижаем рутину и порог входа.<br>\n          Живое демо — плагин <strong style=\"color:#8FE5A8\">GigaMeter<\u002Fstrong> внутри JMeter.\n        <\u002Fp>\n        <div style=\"display:flex;gap:18px;flex-wrap:wrap;margin-top:8px\">\n          <span class=\"badge-dark\">GigaMeter · ИИ внутри JMeter<\u002Fspan>\n          <span class=\"badge-dark\">Gatling-AI · тесты-как-код<\u002Fspan>\n          <span class=\"badge-dark\">Живое демо<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- bottom: meta -->\n      <div style=\"font-size:var(--t-small);font-weight:600;color:rgba(180,210,185,.55)\">\n        Команда нагрузочного тестирования · июнь 2026\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════\n       02 · PAINS\n  ══════════════════════════════════════════════ -->\n  <section data-label=\"02 · Проблемы\" data-screen-label=\"02 · Проблемы\" data-speaker-notes=\"С чем сталкивается каждый инженер НТ сегодня.\">\n    <div class=\"sl sl-dark\">\n\n      <div class=\"kicker\">\n        <div class=\"kicker-dot\"><\u002Fdiv>\n        <span class=\"kicker-text\">Зачем вообще ИИ<\u002Fspan>\n      <\u002Fdiv>\n      <h2 class=\"h2\" style=\"margin-bottom:var(--gap-lg)\">Боли инженера нагрузочного тестирования<\u002Fh2>\n\n      <ul class=\"bullets stagger\">\n        <li class=\"bullet\">\n          <div class=\"bullet-dot\"><\u002Fdiv>\n          <span class=\"bullet-text\"><b>Высокий порог входа:<\u002Fb> Groovy/JSR223 в JMeter, Scala/Java в Gatling, нюансы каждого инструмента.<\u002Fspan>\n        <\u002Fli>\n        <li class=\"bullet\">\n          <div class=\"bullet-dot\"><\u002Fdiv>\n          <span class=\"bullet-text\"><b>Рутина:<\u002Fb> именование элементов, обвязка транзакций, разбор чужих скриптов.<\u002Fspan>\n        <\u002Fli>\n        <li class=\"bullet\">\n          <div class=\"bullet-dot\"><\u002Fdiv>\n          <span class=\"bullet-text\"><b>Легаси без документации:<\u002Fb> что вообще тестирует этот <code style=\"font-family:'JetBrains Mono',monospace;background:rgba(143,213,168,.16);color:#9BEAB4;padding:2px 10px;border-radius:6px;font-size:28px\">.jmx<\u002Fcode>?<\u002Fspan>\n        <\u002Fli>\n        <li class=\"bullet\">\n          <div class=\"bullet-dot\"><\u002Fdiv>\n          <span class=\"bullet-text\"><b>Долгий путь<\u002Fb> «требование → запускаемый тест» — дни вместо часов.<\u002Fspan>\n        <\u002Fli>\n        <li class=\"bullet\">\n          <div class=\"bullet-dot\"><\u002Fdiv>\n          <span class=\"bullet-text\"><b>Дорогая ручная миграция<\u002Fb> между инструментами (JMeter → Gatling).<\u002Fspan>\n        <\u002Fli>\n      <\u002Ful>\n\n      <p class=\"body\" style=\"margin-top:var(--gap-lg);padding-top:var(--gap-md);border-top:2px solid rgba(255,255,255,.14)\">\n        Для бизнеса это — <span class=\"acc\">время, стоимость, риск ошибок<\u002Fspan> и зависимость от носителей знания.\n      <\u002Fp>\n\n      <div class=\"footer\">Сбер · ИИ для нагрузочного тестирования<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════\n       03 · APPROACH\n  ══════════════════════════════════════════════ -->\n  <section data-label=\"03 · Подход\" data-screen-label=\"03 · Подход\" data-speaker-notes=\"Почему два инструмента, а не один? Команды находятся на разных стадиях зрелости.\">\n    <div class=\"sl sl-dark\">\n\n      <div class=\"kicker\" style=\"margin-bottom:18px\">\n        <div class=\"kicker-dot\"><\u002Fdiv>\n        <span class=\"kicker-text\">Наш подход<\u002Fspan>\n      <\u002Fdiv>\n      <h2 class=\"h2\" style=\"margin-bottom:14px\">Не один инструмент, а набор решений<\u002Fh2>\n      <p class=\"body\" style=\"margin-bottom:18px;max-width:1480px\">\n        Команды на разных стадиях зрелости: кто-то живёт в JMeter, кто-то переходит на тесты-как-код.\n        Один инструмент не закроет оба мира — поэтому два дополняющих, встроенных в текущий рабочий процесс.\n      <\u002Fp>\n\n      <!-- Spectrum -->\n      <div class=\"stagger\" style=\"display:grid;grid-template-columns:1fr 110px 1fr;gap:0;align-items:stretch\">\n        <div class=\"card\" style=\"border-radius:20px 0 0 20px;padding:24px 34px\">\n          <span style=\"font-size:var(--t-kicker);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9BEAB4;display:block;margin-bottom:12px\">Здесь и сейчас<\u002Fspan>\n          <h3 style=\"font-size:44px;font-weight:800;color:#EAF6EC;margin-bottom:10px\">GigaMeter<\u002Fh3>\n          <p class=\"body\">ИИ-ассистент внутри JMeter — помогает там, где команда уже работает.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.09);font-size:42px;color:var(--teal);font-weight:900\">⟷<\u002Fdiv>\n        <div class=\"card\" style=\"border-radius:0 20px 20px 0;padding:24px 34px\">\n          <span style=\"font-size:var(--t-kicker);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9BEAB4;display:block;margin-bottom:12px\">Переход в код<\u002Fspan>\n          <h3 style=\"font-size:44px;font-weight:800;color:#EAF6EC;margin-bottom:10px\">Gatling-AI<\u002Fh3>\n          <p class=\"body\">ИИ-агент строит и мигрирует тесты-как-код на Gatling.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p class=\"body\" style=\"margin-top:18px\">\n        Сегодня <span class=\"acc\">живьём показываем GigaMeter<\u002Fspan>, второй инструмент — на слайдах.\n      <\u002Fp>\n\n      <div class=\"footer\">Сбер · ИИ для нагрузочного тестирования<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════\n       04 · TECH (XML → JSON → OPS)\n  ══════════════════════════════════════════════ -->\n  <section data-label=\"04 · Техническая суть\" data-screen-label=\"04 · Техническая суть\" data-speaker-notes=\"Почему мы не показываем XML модели напрямую. JSON как промежуточный слой, ops как протокол правок.\">\n    <div class=\"sl sl-dark\">\n\n      <div class=\"kicker\">\n        <div class=\"kicker-dot\"><\u002Fdiv>\n        <span class=\"kicker-text kicker-text-light\">GigaMeter · техническая суть<\u002Fspan>\n      <\u002Fdiv>\n      <h2 class=\"h2 h2-light\" style=\"margin-bottom:12px\">Как мы обходим XML<\u002Fh2>\n      <p style=\"font-size:30px;line-height:1.45;color:rgba(200,230,205,.85);margin-bottom:var(--gap-md);max-width:1560px\">\n        JMeter-план — громоздкий XML, LLM его ломают. Поэтому модель\n        <strong style=\"color:#8FE5A8\">никогда не видит сырой XML<\u002Fstrong>: дерево → компактный JSON,\n        а правки приходят протоколом операций <code style=\"font-family:'JetBrains Mono',monospace;background:rgba(143,213,168,.15);color:#8FE5A8;padding:2px 10px;border-radius:6px\">jmeter-ops<\u002Fcode>.\n      <\u002Fp>\n\n      <div class=\"stagger\" style=\"display:grid;grid-template-columns:1fr 56px 1fr 56px 1fr;column-gap:14px;align-items:stretch;flex:1;min-height:0\">\n\n        <pre class=\"code\"><span class=\"code-cap\">① Исходный .jmx<\u002Fspan><span class=\"tok-t\">&lt;HTTPSamplerProxy<\u002Fspan>\n  name=<span class=\"tok-s\">\"HTTP Request\"<\u002Fspan><span class=\"tok-t\">&gt;<\u002Fspan>\n <span class=\"tok-t\">&lt;stringProp<\u002Fspan>\n   name=<span class=\"tok-s\">\"method\"<\u002Fspan><span class=\"tok-t\">&gt;<\u002Fspan>\n   <span class=\"tok-hl\">POST<\u002Fspan>\n <span class=\"tok-t\">&lt;stringProp<\u002Fspan>\n   name=<span class=\"tok-s\">\"domain\"<\u002Fspan><span class=\"tok-t\">&gt;<\u002Fspan>\n   <span class=\"tok-hl\">api.shop.local<\u002Fspan>\n <span class=\"tok-t\">&lt;stringProp<\u002Fspan>\n   name=<span class=\"tok-s\">\"path\"<\u002Fspan><span class=\"tok-t\">&gt;<\u002Fspan>\n   <span class=\"tok-hl\">/orders<\u002Fspan>\n<span class=\"tok-t\">&lt;/HTTPSamplerProxy&gt;<\u002Fspan><\u002Fpre>\n\n        <div style=\"display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:var(--teal)\">→<\u002Fdiv>\n\n        <pre class=\"code\"><span class=\"code-cap\">② Компактный JSON<\u002Fspan>{\n  <span class=\"tok-k\">\"id\"<\u002Fspan>: <span class=\"tok-hl\">7<\u002Fspan>,\n  <span class=\"tok-k\">\"type\"<\u002Fspan>: <span class=\"tok-s\">\"HTTPSamplerProxy\"<\u002Fspan>,\n  <span class=\"tok-k\">\"name\"<\u002Fspan>: <span class=\"tok-s\">\"HTTP Request\"<\u002Fspan>,\n  <span class=\"tok-k\">\"props\"<\u002Fspan>: {\n    <span class=\"tok-k\">\"method\"<\u002Fspan>: <span class=\"tok-hl\">\"POST\"<\u002Fspan>,\n    <span class=\"tok-k\">\"domain\"<\u002Fspan>: <span class=\"tok-hl\">\"api.shop.local\"<\u002Fspan>,\n    <span class=\"tok-k\">\"path\"<\u002Fspan>:   <span class=\"tok-hl\">\"/orders\"<\u002Fspan>\n  }\n}<\u002Fpre>\n\n        <div style=\"display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:var(--teal)\">→<\u002Fdiv>\n\n        <pre class=\"code\"><span class=\"code-cap\">③ Ответ · jmeter-ops<\u002Fspan>[\n  { <span class=\"tok-k\">\"op\"<\u002Fspan>: <span class=\"tok-s\">\"set_property\"<\u002Fspan>,\n    <span class=\"tok-k\">\"id\"<\u002Fspan>: <span class=\"tok-hl\">7<\u002Fspan>, <span class=\"tok-k\">\"key\"<\u002Fspan>: <span class=\"tok-s\">\"path\"<\u002Fspan>,\n    <span class=\"tok-k\">\"value\"<\u002Fspan>: <span class=\"tok-hl\">\"/api/v1/orders\"<\u002Fspan> },\n  { <span class=\"tok-k\">\"op\"<\u002Fspan>: <span class=\"tok-s\">\"add_element\"<\u002Fspan>,\n    <span class=\"tok-k\">\"parentId\"<\u002Fspan>: <span class=\"tok-hl\">7<\u002Fspan>,\n    <span class=\"tok-k\">\"elementType\"<\u002Fspan>: <span class=\"tok-s\">\"responseassertion\"<\u002Fspan>,\n    <span class=\"tok-k\">\"props\"<\u002Fspan>: { <span class=\"tok-k\">\"test\"<\u002Fspan>: <span class=\"tok-hl\">\"201\"<\u002Fspan> } }\n]<\u002Fpre>\n\n      <\u002Fdiv>\n\n      <div class=\"footer footer-light\">Сбер · ИИ для нагрузочного тестирования<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════\n       05 · HOW IT WORKS\n  ══════════════════════════════════════════════ -->\n  <section data-label=\"05 · Как работает\" data-screen-label=\"05 · Как работает\" data-speaker-notes=\"Агент правит план, человек видит дифф и подтверждает. Никаких слепых правок.\">\n    <div class=\"sl sl-dark\">\n\n      <div class=\"kicker\">\n        <div class=\"kicker-dot\"><\u002Fdiv>\n        <span class=\"kicker-text\">GigaMeter · как работает<\u002Fspan>\n      <\u002Fdiv>\n      <h2 class=\"h2\" style=\"margin-bottom:var(--gap-md)\">Агент правит план, человек подтверждает<\u002Fh2>\n      <p class=\"body\" style=\"margin-bottom:var(--gap-lg);max-width:1400px\">\n        Плагин подмешивает в промпт текущее дерево (каждый элемент с\n        <code style=\"font-family:'JetBrains Mono',monospace;background:rgba(143,213,168,.16);color:#9BEAB4;padding:2px 10px;border-radius:6px;font-size:28px\">#id<\u002Fcode>).\n        Агент возвращает блок <code style=\"font-family:'JetBrains Mono',monospace;background:rgba(143,213,168,.16);color:#9BEAB4;padding:2px 10px;border-radius:6px;font-size:28px\">jmeter-ops<\u002Fcode>,\n        плагин применяет операции к реальному дереву.\n      <\u002Fp>\n\n      <!-- Pipeline -->\n      <div class=\"pipe\" style=\"margin-bottom:var(--gap-lg)\">\n        <span class=\"pipe-step\">Запрос в чат<\u002Fspan>\n        <span class=\"pipe-arr\">→<\u002Fspan>\n        <span class=\"pipe-step\">jmeter-ops от модели<\u002Fspan>\n        <span class=\"pipe-arr\">→<\u002Fspan>\n        <span class=\"pipe-step-green\">Preview диффа<\u002Fspan>\n        <span class=\"pipe-arr\">→<\u002Fspan>\n        <span class=\"pipe-step\">Confirm<\u002Fspan>\n        <span class=\"pipe-arr\">→<\u002Fspan>\n        <span class=\"pipe-step-green\">Apply на дерево<\u002Fspan>\n        <span class=\"pipe-arr\">→<\u002Fspan>\n        <span class=\"pipe-step\">@rollback<\u002Fspan>\n      <\u002Fdiv>\n\n      <ul class=\"bullets\">\n        <li class=\"bullet\">\n          <div class=\"bullet-dot\"><\u002Fdiv>\n          <span class=\"bullet-text\"><b>Редактируемые скиллы:<\u002Fb>\n            <code style=\"font-family:'JetBrains Mono',monospace;background:rgba(143,213,168,.16);color:#9BEAB4;padding:2px 10px;border-radius:6px;font-size:28px\">@plan<\u002Fcode>,\n            <code style=\"font-family:'JetBrains Mono',monospace;background:rgba(143,213,168,.16);color:#9BEAB4;padding:2px 10px;border-radius:6px;font-size:28px\">@lint<\u002Fcode>,\n            <code style=\"font-family:'JetBrains Mono',monospace;background:rgba(143,213,168,.16);color:#9BEAB4;padding:2px 10px;border-radius:6px;font-size:28px\">@optimize<\u002Fcode>. <b>Встроенные команды:<\u002Fb>\n            <code style=\"font-family:'JetBrains Mono',monospace;background:rgba(143,213,168,.16);color:#9BEAB4;padding:2px 10px;border-radius:6px;font-size:28px\">@this<\u002Fcode>,\n            <code style=\"font-family:'JetBrains Mono',monospace;background:rgba(143,213,168,.16);color:#9BEAB4;padding:2px 10px;border-radius:6px;font-size:28px\">@rollback<\u002Fcode>.\n          <\u002Fspan>\n        <\u002Fli>\n        <li class=\"bullet\">\n          <div class=\"bullet-dot\"><\u002Fdiv>\n          <span class=\"bullet-text\"><b>Безопасность встроена:<\u002Fb> preview диффа и откат до изменения дерева — ни одной «слепой» правки.<\u002Fspan>\n        <\u002Fli>\n      <\u002Ful>\n\n      <div class=\"footer\">Сбер · ИИ для нагрузочного тестирования<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════\n       06 · LIVE DEMO\n  ══════════════════════════════════════════════ -->\n  <section data-label=\"06 · Живое демо\" data-screen-label=\"06 · Живое демо\" data-speaker-notes=\"~7 минут. Три сценария: @plan → @lint → @this.\">\n    <div class=\"sl sl-mid\">\n\n      <div style=\"display:flex;align-items:center;gap:24px;margin-bottom:var(--gap-md)\">\n        <div class=\"kicker\" style=\"margin-bottom:0\">\n          <div class=\"kicker-dot\"><\u002Fdiv>\n          <span class=\"kicker-text kicker-text-light\">GigaMeter · ~7 минут<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px;background:#FDECEC;border:1px solid #F3C6C6;padding:12px 24px;border-radius:999px;margin-left:auto\">\n          <div style=\"width:16px;height:16px;border-radius:50%;background:#E5392B;animation:pulse-r 1.3s infinite\"><\u002Fdiv>\n          <span style=\"font-size:26px;font-weight:800;color:#C0392B;letter-spacing:.08em;text-transform:uppercase\">Живое демо<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h2 class=\"h2 h2-light\" style=\"margin-bottom:var(--gap-md)\">Три сценария<\u002Fh2>\n\n      <div class=\"stagger\" style=\"display:flex;flex-direction:column;gap:20px;flex:1\">\n        <div class=\"dstep\">\n          <div class=\"dstep-num\">1<\u002Fdiv>\n          <div class=\"dstep-text\">\n            <code>@plan<\u002Fcode> логин → список заказов → создание заказа.\n            Preview (Thread Group, HTTP Sampler-ы, Token Extractor, Assertion, Timer) →\n            <code>apply<\u002Fcode> → <code>@rollback<\u002Fcode>.\n            <strong style=\"color:#8FE5A8\"> От текста до структуры за секунды.<\u002Fstrong>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dstep\">\n          <div class=\"dstep-num\">2<\u002Fdiv>\n          <div class=\"dstep-text\">\n            <code>@lint<\u002Fcode> на хаотичных именах → единый стандарт\n            (<code>TG_<\u002Fcode>, <code>HTTP_…<\u002Fcode>, <code>JSR_<\u002Fcode>).\n            Бонус: «используй snake_case, только английский».\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dstep\">\n          <div class=\"dstep-num\">3<\u002Fdiv>\n          <div class=\"dstep-text\">\n            <code>@this<\u002Fcode> на нетривиальном JSR223 → ИИ объясняет, что делает скрипт\n            и какие переменные читает / пишет.\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"safety-bar\" style=\"margin-top:var(--gap-md);border-left-color:var(--yellow)\">\n        <span style=\"font-size:28px;color:rgba(200,230,205,.75)\">Запас по времени: <code>@plan analyze<\u002Fcode> на готовом <code>.jmx<\u002Fcode> и контекстное меню («Рефакторинг кода» / «Try/Catch/Finally»). Провайдер проверен заранее.<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"footer footer-light\">Сбер · ИИ для нагрузочного тестирования<\u002Fdiv>\n    <\u002Fdiv>\n    <style>@keyframes pulse-r{0%,100%{opacity:1}50%{opacity:.3}}<\u002Fstyle>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════\n       07 · VALUE\n  ══════════════════════════════════════════════ -->\n  <section data-label=\"07 · Ценность\" data-screen-label=\"07 · Ценность\" data-speaker-notes=\"Что конкретно получает инженер от GigaMeter.\">\n    <div class=\"sl sl-dark\">\n\n      <div class=\"kicker\">\n        <div class=\"kicker-dot\"><\u002Fdiv>\n        <span class=\"kicker-text\">GigaMeter · ценность<\u002Fspan>\n      <\u002Fdiv>\n      <h2 class=\"h2\" style=\"margin-bottom:var(--gap-lg)\">Что это даёт инженеру<\u002Fh2>\n\n      <div class=\"stagger\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px;flex:1\">\n\n        <div class=\"card\" style=\"display:flex;flex-direction:column;gap:20px\">\n          <div class=\"icon-circle\">\n            <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\"><path d=\"M12 3v18M5 10l7-7 7 7\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h3 style=\"font-size:40px;font-weight:800;color:#EAF6EC;line-height:1.2\">Ниже порог входа<\u002Fh3>\n          <p class=\"body\">Меньше зависимости от носителей Groovy-знаний: ИИ читает и пишет JSR223 за инженера.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"card\" style=\"display:flex;flex-direction:column;gap:20px\">\n          <div class=\"icon-circle\">\n            <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\"><path d=\"M3 12h18M3 6h18M3 18h12\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h3 style=\"font-size:40px;font-weight:800;color:#EAF6EC;line-height:1.2\">Меньше рутины<\u002Fh3>\n          <p class=\"body\">Именование, обвязка транзакций, разбор чужих скриптов — автоматически.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"card\" style=\"display:flex;flex-direction:column;gap:20px\">\n          <div class=\"icon-circle\">\n            <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\"><path d=\"M9 12l2 2 4-4M21 12a9 9 0 11-18 0 9 9 0 0118 0z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <h3 style=\"font-size:40px;font-weight:800;color:#EAF6EC;line-height:1.2\">Без смены инструмента<\u002Fh3>\n          <p class=\"body\">Работает там, где команда уже работает. Preview и <code style=\"font-family:'JetBrains Mono',monospace;font-size:28px;background:rgba(143,213,168,.16);color:#9BEAB4;padding:2px 8px;border-radius:6px\">@rollback<\u002Fcode> снижают риск ошибок.<\u002Fp>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div class=\"footer\">Сбер · ИИ для нагрузочного тестирования<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════\n       08 · GATLING WHAT\n  ══════════════════════════════════════════════ -->\n  <section data-label=\"08 · Gatling-AI\" data-screen-label=\"08 · Gatling-AI\" data-speaker-notes=\"Gatling-AI — второй инструмент, без живого демо сегодня. Что он умеет.\">\n    <div class=\"sl sl-dark\">\n\n      <div class=\"kicker\">\n        <div class=\"kicker-dot\"><\u002Fdiv>\n        <span class=\"kicker-text\">Gatling-AI · без живого демо<\u002Fspan>\n      <\u002Fdiv>\n      <h2 class=\"h2\" style=\"margin-bottom:var(--gap-md)\">ИИ-агент для тестов-как-код<\u002Fh2>\n      <p class=\"body\" style=\"margin-bottom:var(--gap-lg);max-width:1400px\">\n        Набор скиллов, команд, хуков и субагентов: превращает агента в инженера нагрузочного тестирования на Gatling OSS —\n        генерация на Java, сборка Maven.\n      <\u002Fp>\n\n      <ul class=\"bullets stagger\">\n        <li class=\"bullet\">\n          <div class=\"bullet-dot\"><\u002Fdiv>\n          <span class=\"bullet-text\"><b>Документация → сценарий:<\u002Fb> из файлов или диалога в YAML-контракт.<\u002Fspan>\n        <\u002Fli>\n        <li class=\"bullet\">\n          <div class=\"bullet-dot\"><\u002Fdiv>\n          <span class=\"bullet-text\"><b>JMeter → Gatling:<\u002Fb> миграция <code style=\"font-family:'JetBrains Mono',monospace;background:rgba(143,213,168,.16);color:#9BEAB4;padding:2px 10px;border-radius:6px;font-size:28px\">.jmx<\u002Fcode> с фиксацией диспозиции каждого элемента.<\u002Fspan>\n        <\u002Fli>\n        <li class=\"bullet\">\n          <div class=\"bullet-dot\"><\u002Fdiv>\n          <span class=\"bullet-text\"><b>Документирование легаси:<\u002Fb> человекочитаемое описание недокументированных планов.<\u002Fspan>\n        <\u002Fli>\n        <li class=\"bullet\">\n          <div class=\"bullet-dot\"><\u002Fdiv>\n          <span class=\"bullet-text\"><b>Сценарий → код:<\u002Fb> компилируемая Java-симуляция со сложными профилями нагрузки.<\u002Fspan>\n        <\u002Fli>\n      <\u002Ful>\n\n      <div class=\"footer\">Сбер · ИИ для нагрузочного тестирования<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════\n       09 · GATLING CONTRACT\n  ══════════════════════════════════════════════ -->\n  <section data-label=\"09 · Сценарий как контракт\" data-screen-label=\"09 · Сценарий как контракт\" data-speaker-notes=\"Ключевая идея: scenario.yaml — единственный источник истины между текстом и кодом.\">\n    <div class=\"sl sl-dark\">\n\n      <div class=\"kicker\">\n        <div class=\"kicker-dot\"><\u002Fdiv>\n        <span class=\"kicker-text\">Gatling-AI · ключевая идея<\u002Fspan>\n      <\u002Fdiv>\n      <h2 class=\"h2\" style=\"margin-bottom:var(--gap-md)\">Сценарий как контракт<\u002Fh2>\n      <p class=\"body\" style=\"margin-bottom:var(--gap-lg);max-width:1400px\">\n        Между «текстом» и «кодом» всегда промежуточный артефакт —\n        <code style=\"font-family:'JetBrains Mono',monospace;background:rgba(143,213,168,.16);color:#9BEAB4;padding:2px 10px;border-radius:6px;font-size:30px\">scenario.yaml<\u002Fcode>\n        + человекочитаемый паспорт. Правим сценарий и регенерируем — не правим Java руками.\n      <\u002Fp>\n\n      <div class=\"pipe\" style=\"margin-bottom:var(--gap-lg)\">\n        <span class=\"pipe-step\">Docs / JMeter / диалог<\u002Fspan>\n        <span class=\"pipe-arr\">→<\u002Fspan>\n        <span class=\"pipe-step-green\">scenario.yaml<\u002Fspan>\n        <span class=\"pipe-arr\">→<\u002Fspan>\n        <span class=\"pipe-step\">passport.md<\u002Fspan>\n        <span class=\"pipe-arr\">→<\u002Fspan>\n        <span class=\"pipe-step-green\">Java Gatling<\u002Fspan>\n        <span class=\"pipe-arr\">→<\u002Fspan>\n        <span class=\"pipe-step\">quality-gate<\u002Fspan>\n        <span class=\"pipe-arr\">→<\u002Fspan>\n        <span class=\"pipe-step\">тест + отчёты<\u002Fspan>\n      <\u002Fdiv>\n\n      <p class=\"body\" style=\"max-width:1400px;padding:32px 40px;background:rgba(33,160,56,.16);border-radius:16px;border-left:5px solid var(--green)\">\n        <span class=\"acc\">scenario.yaml — единственный источник истины,<\u002Fspan>\n        который проверяет человек. Никакого «ИИ накидал код».\n      <\u002Fp>\n\n      <div class=\"footer\">Сбер · ИИ для нагрузочного тестирования<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════\n       10 · GATLING QUALITY\n  ══════════════════════════════════════════════ -->\n  <section data-label=\"10 · Контур качества\" data-screen-label=\"10 · Контур качества\" data-speaker-notes=\"Что делает quality gate и почему результату можно доверять.\">\n    <div class=\"sl sl-dark\">\n\n      <div class=\"kicker\">\n        <div class=\"kicker-dot\"><\u002Fdiv>\n        <span class=\"kicker-text\">Gatling-AI · главное отличие<\u002Fspan>\n      <\u002Fdiv>\n      <h2 class=\"h2\" style=\"margin-bottom:var(--gap-md)\">Контур качества<\u002Fh2>\n      <p class=\"body\" style=\"margin-bottom:var(--gap-lg);max-width:1300px\">\n        Результат не отдаётся «на доверии»: после генерации запускается\n        <strong class=\"acc\">quality gate<\u002Fstrong>.\n      <\u002Fp>\n\n      <div class=\"stagger\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px;flex:1\">\n\n        <div class=\"card\">\n          <h3>Детерминированные проверки<\u002Fh3>\n          <ul class=\"bullets\">\n            <li class=\"bullet\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\">JSON-schema сценария<\u002Fspan><\u002Fli>\n            <li class=\"bullet\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\">Семантические линтеры<\u002Fspan><\u002Fli>\n            <li class=\"bullet\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\">Компиляция Java<\u002Fspan><\u002Fli>\n            <li class=\"bullet\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\">Smoke-прогон на mock SUT<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n\n        <div class=\"card\">\n          <h3>Контроль и аудит<\u002Fh3>\n          <ul class=\"bullets\">\n            <li class=\"bullet\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\">Независимый read-only валидатор-субагент<\u002Fspan><\u002Fli>\n            <li class=\"bullet\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\">Отчёт: passed / passed_with_warnings / blocked<\u002Fspan><\u002Fli>\n            <li class=\"bullet\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\">Запрет «готово» без зелёного гейта<\u002Fspan><\u002Fli>\n            <li class=\"bullet\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\">HTTP поддержан end-to-end<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div class=\"footer\">Сбер · ИИ для нагрузочного тестирования<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════\n       11 · TOGETHER\n  ══════════════════════════════════════════════ -->\n  <section data-label=\"11 · Роли\" data-screen-label=\"11 · Роли\" data-speaker-notes=\"Где ИИ не заменит инженера: ИИ снимает рутину, человек держит суждение, корректность модели нагрузки и ответственность.\">\n    <div class=\"sl sl-dark\">\n\n      <div class=\"kicker\">\n        <div class=\"kicker-dot\"><\u002Fdiv>\n        <span class=\"kicker-text\">Разделение труда<\u002Fspan>\n      <\u002Fdiv>\n      <h2 class=\"h2\" style=\"margin-bottom:var(--gap-lg)\">ИИ снимает рутину — решение остаётся за инженером<\u002Fh2>\n\n      <div class=\"stagger\" style=\"display:grid;grid-template-columns:1fr 1fr;column-gap:28px;flex:1;min-height:0\">\n\n        <div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden\">\n          <div style=\"background:var(--green-deep);color:#fff;font-weight:800;font-size:30px;padding:18px 28px\">ИИ берёт на себя · рутина<\u002Fdiv>\n          <ul style=\"list-style:none;margin:0;padding:6px 28px 16px\">\n            <li class=\"bullet\" style=\"margin:18px 0\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\" style=\"font-size:30px;line-height:1.4\"><b>Рутина:<\u002Fb> именование, обвязка транзакций, разбор чужих скриптов<\u002Fspan><\u002Fli><li class=\"bullet\" style=\"margin:18px 0\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\" style=\"font-size:30px;line-height:1.4\"><b>Черновики:<\u002Fb> план, сценарий, код JSR223 / Java<\u002Fspan><\u002Fli><li class=\"bullet\" style=\"margin:18px 0\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\" style=\"font-size:30px;line-height:1.4\"><b>Перенос:<\u002Fb> миграция .jmx → Gatling, документирование легаси<\u002Fspan><\u002Fli><li class=\"bullet\" style=\"margin:18px 0\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\" style=\"font-size:30px;line-height:1.4\"><b>Формальные проверки:<\u002Fb> schema, линтеры, компиляция, smoke<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n\n        <div style=\"background:rgba(61,228,137,.06);border:1px solid rgba(61,228,137,.30);border-radius:16px;overflow:hidden\">\n          <div style=\"background:linear-gradient(135deg,#22C24E,#0E9E7E);color:#fff;font-weight:800;font-size:30px;padding:18px 28px\">Остаётся за инженером · суждение<\u002Fdiv>\n          <ul style=\"list-style:none;margin:0;padding:6px 28px 16px\">\n            <li class=\"bullet\" style=\"margin:18px 0\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\" style=\"font-size:30px;line-height:1.4\"><b>Постановка задачи:<\u002Fb> что и зачем тестируем, бизнес-контекст, SLA и критерии<\u002Fspan><\u002Fli><li class=\"bullet\" style=\"margin:18px 0\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\" style=\"font-size:30px;line-height:1.4\"><b>Логика подачи нагрузки:<\u002Fb> профиль (open/closed, ramp/spike/soak), pacing, think-time, параметризация<\u002Fspan><\u002Fli><li class=\"bullet\" style=\"margin:18px 0\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\" style=\"font-size:30px;line-height:1.4\"><b>Контроль паразитной нагрузки:<\u002Fb> лишние запросы, тяжёлые ассерты и логирование в горячем пути, случайные циклы — то, что искажает результат и грузит инжектор/SUT<\u002Fspan><\u002Fli><li class=\"bullet\" style=\"margin:18px 0\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\" style=\"font-size:30px;line-height:1.4\"><b>Ревью и ответственность:<\u002Fb> preview диффа, scenario.yaml, passport — итог подтверждает человек<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <p class=\"body\" style=\"margin-top:var(--gap-lg);max-width:1560px\">\n        <strong style=\"color:#3DE489\">ИИ ускоряет, но не отвечает.<\u002Fstrong> Корректность модели нагрузки и чистоту теста обеспечивает инженер. Сценарий перехода в силе: навели порядок в JMeter (<code style=\"font-family:'JetBrains Mono',monospace;background:rgba(143,213,168,.16);color:#9BEAB4;padding:2px 10px;border-radius:6px;font-size:28px\">@lint<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;background:rgba(143,213,168,.16);color:#9BEAB4;padding:2px 10px;border-radius:6px;font-size:28px\">@plan analyze<\u002Fcode>) → мигрировали агентом в Gatling.\n      <\u002Fp>\n\n      <div class=\"footer\">Сбер · ИИ для нагрузочного тестирования<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════\n       12 · EFFECT / CTA\n  ══════════════════════════════════════════════ -->\n  <section data-label=\"12 · Эффект\" data-screen-label=\"12 · Эффект\" data-speaker-notes=\"Резюме ценности и предложение о пилоте.\">\n    <div class=\"sl sl-dark\">\n\n      <div class=\"kicker\">\n        <div class=\"kicker-dot\"><\u002Fdiv>\n        <span class=\"kicker-text\">Эффект и следующий шаг<\u002Fspan>\n      <\u002Fdiv>\n      <h2 class=\"h2\" style=\"margin-bottom:var(--gap-lg)\">Что это даёт команде<\u002Fh2>\n\n      <ul class=\"bullets stagger\" style=\"margin-bottom:var(--gap-lg)\">\n        <li class=\"bullet\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\">Ниже порог входа и зависимость от носителей знания.<\u002Fspan><\u002Fli>\n        <li class=\"bullet\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\">Быстрее путь «требование → запускаемый тест».<\u002Fspan><\u002Fli>\n        <li class=\"bullet\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\">Дешевле миграция и документирование легаси.<\u002Fspan><\u002Fli>\n        <li class=\"bullet\"><div class=\"bullet-dot\"><\u002Fdiv><span class=\"bullet-text\">Выше доверие к ИИ-результату за счёт контура качества.<\u002Fspan><\u002Fli>\n      <\u002Ful>\n\n      <div class=\"cta\">\n        <h3>Предложение<\u002Fh3>\n        <p>Запустить пилот на одном реальном сценарии для каждого инструмента — и оценить эффект на метриках команды.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"footer\">Сбер · ИИ для нагрузочного тестирования<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════════════════════════════════════════\n       13 · Q&A\n  ══════════════════════════════════════════════ -->\n  <section data-label=\"13 · Вопросы\" data-screen-label=\"13 · Вопросы\" data-speaker-notes=\"Открываем для вопросов.\">\n    <div class=\"sl sl-dark\" style=\"justify-content:space-between\">\n\n      <div style=\"display:flex;align-items:center;gap:18px\">\n        <svg width=\"58\" height=\"58\" viewBox=\"0 0 100 100\"><use href=\"#smark\"><\u002Fuse><\u002Fsvg>\n        <span style=\"font-size:38px;font-weight:800;color:#E2F0E5;letter-spacing:-.01em\">Сбер<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:var(--gap-md)\">\n        <h1 class=\"grad-text\" style=\"font-size:var(--t-title);font-weight:900;line-height:1.06\">\n          Спасибо.<br>Вопросы?\n        <\u002Fh1>\n        <p class=\"lead lead-light\" style=\"max-width:1100px\">\n          GigaMeter — ИИ внутри JMeter · Gatling-AI — тесты-как-код.<br>\n          Один подход: снижаем рутину и порог входа.\n        <\u002Fp>\n        <div style=\"display:flex;gap:18px;flex-wrap:wrap;margin-top:8px\">\n          <span class=\"badge-dark\">Репозитории и документация — по запросу<\u002Fspan>\n          <span class=\"badge-dark\">Готовы к пилоту<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:var(--t-small);font-weight:600;color:rgba(180,210,185,.45)\">\n        Команда нагрузочного тестирования · июнь 2026\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
