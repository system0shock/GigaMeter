# GigaMeter - JMeter AI Plugin Configuration

## Supported providers: Qwen Code CLI, GigaCode CLI, Sber GigaChat, DeepSeek

# AI Refactoring Configuration
jmeter.ai.refactoring.enabled=true

# Active provider: qwen | gigacode | (giga | deepseek require cloud providers enabled)
jmeter.ai.service.type=qwen

# Cloud providers (GigaChat/DeepSeek) are hidden by default — the plugin is CLI-first.
# Set to true to show them again in the model selector.
gigameter.providers.cloud.enabled=false

# Directory holding editable "skill" instruction files (lint.md, plan.md, optimize.md) used by
# @lint/@plan/@optimize in CLI mode. Defaults are seeded here on first use; edit them to taste.
# Default: <user.home>/.gigameter/skills
# gigameter.skills.dir=

# -----------------------------
# Sber GigaChat Configuration
# -----------------------------
# Optional direct token. If set, OAuth step is skipped.
# giga.access.token=

giga.auth.key=
giga.auth.url=https://ngw.devices.sberbank.ru:9443/api/v2/oauth
giga.scope=GIGACHAT_API_PERS
giga.api.base.url=https://gigachat.devices.sberbank.ru/api/v1
giga.default.model=GigaChat
giga.temperature=0.5
giga.max.tokens=1024
giga.max.history.size=10
giga.timeout.ms=30000
giga.ssl.insecure=false
giga.system.prompt=Вы — экспертный помощник по Apache JMeter в плагине GigaMeter. Отвечайте по-русски, кратко и практично. Помогайте создавать, оптимизировать и отлаживать тест-планы JMeter.

# -----------------------------
# DeepSeek Configuration
# -----------------------------
deepseek.api.key=YOUR_DEEPSEEK_API_KEY
deepseek.api.base.url=https://api.deepseek.com/v1
deepseek.default.model=deepseek-chat
deepseek.temperature=0.5
deepseek.max.tokens=1024
deepseek.max.history.size=10
deepseek.timeout.ms=30000
deepseek.system.prompt=Вы — экспертный помощник по Apache JMeter в плагине GigaMeter. Отвечайте по-русски, кратко и по делу. Помогайте создавать, анализировать, оптимизировать и отлаживать тест-планы JMeter.

# -----------------------------
# Local CLI providers (Qwen Code CLI / GigaCode CLI)
# -----------------------------
# These providers call a locally installed CLI agent in headless mode — no API key needed.
# A provider appears in the chat model selector only when its *.cli.command is set.
# The prompt is delivered via the CLI's stdin (no command-line length limit); on Windows
# the plugin launches *.cmd/*.bat npm shims through "cmd /c" automatically.
#
# CLI agents can EDIT the test plan: the plugin injects the current tree (each element tagged
# with a #id) plus the jmeter-ops protocol into the prompt. When the agent replies with a
# ```jmeter-ops block, the plugin previews the operations, asks for confirmation, applies them
# on the EDT, and lets you undo the whole batch with @rollback. The keyword "add a ..." sentinel
# handler is disabled for CLI providers (the agent drives edits directly).

# Qwen Code CLI (install: npm i -g @qwen-code/qwen-code)
# qwen.cli.command=qwen
# Models offered in the selector (qwen has no "list models" API). Comma/space separated; each
# becomes a "qwen-cli:<model>" entry. The special value "default" uses whatever model qwen itself is
# configured with (no --model flag) — this is the most reliable option and the one to use for a
# cloud model, because qwen's --model override does NOT carry cloud-provider auth (you'd get a 401).
# Only list explicit model ids that your local qwen can actually serve via --model (e.g. local
# ollama models). Example: default + a local model:
# qwen.cli.models=default,qwen3.6:35b-a3b-q4_K_M
# Timeout per call. LOCAL models are slow (measured 150-600s); cloud models ~10-30s.
# Raise this if you use a local model, or you will hit timeouts.
qwen.cli.timeout.ms=180000
qwen.cli.max.history.size=10
# Deliver prompt via stdin (recommended) or as a -p argument (false)
qwen.cli.prompt.via.stdin=true
# Parse structured --output-format json output (recommended)
qwen.cli.json.output=true
# Stream the reply live (--output-format stream-json) instead of waiting for the whole answer.
qwen.cli.stream=true
# Persistent session (--chat-recording + --resume): the agent remembers prior turns, so only the
# new turn (and changed tree context) is sent each time. ON by default — without it the full history
# is re-sent every turn and the agent may re-answer old messages. Needs supports.resume.
qwen.cli.sessions=true
qwen.cli.supports.resume=true
# Flag to inject the system prompt (e.g. --append-system-prompt). Empty = fold into the prompt text.
qwen.cli.system.prompt.flag=
# Extra args passed verbatim (quote-aware), e.g. --include-directories "C:\My Tests"
qwen.cli.extra.args=
# Output charset of the CLI (use cp1251 if the Windows console garbles Cyrillic)
qwen.cli.charset=UTF-8
# Auto-approve file/shell actions — leave false unless you understand the risk
qwen.cli.yolo=false
qwen.cli.system.prompt=Вы — экспертный помощник по Apache JMeter в плагине GigaMeter. Отвечайте по-русски, кратко и по делу.

# GigaCode CLI (flags assumed identical to Qwen; confirm via Stage-0 spike)
# gigacode.cli.command=gigacode
gigacode.cli.timeout.ms=60000
gigacode.cli.max.history.size=10
gigacode.cli.prompt.via.stdin=true
gigacode.cli.json.output=true
gigacode.cli.system.prompt.flag=
gigacode.cli.extra.args=
gigacode.cli.charset=UTF-8
gigacode.cli.yolo=false
gigacode.cli.system.prompt=Вы — экспертный помощник по Apache JMeter в плагине GigaMeter. Отвечайте по-русски, кратко и по делу.
