# GigaMeter - JMeter AI Plugin Configuration

## GigaMeter supports Sber GigaChat, Qwen Code CLI, and GigaCode CLI
## If you need any other APIs, please raise an issue on GitHub

# AI Refactoring Configuration
# Set to true to enable AI Refactoring
# This setting is separated from the GigaMeter chat assistant configuration
jmeter.ai.refactoring.enabled=true

# Set to 'giga' to use Sber GigaChat
# For CLI providers (Qwen Code, GigaCode), set qwen.cli.command / gigacode.cli.command below
jmeter.ai.service.type=giga


# -----------------------------
# Sber GigaChat Configuration
# -----------------------------

# Optional direct token. If set, OAuth step is skipped.
# giga.access.token=

# Base64-encoded "client_id:client_secret" for OAuth (Basic auth).
# Required if giga.access.token is empty.
giga.auth.key=

# OAuth settings
giga.auth.url=https://ngw.devices.sberbank.ru:9443/api/v2/oauth
giga.scope=GIGACHAT_API_PERS

# API settings
giga.api.base.url=https://gigachat.devices.sberbank.ru/api/v1
giga.default.model=GigaChat
giga.temperature=0.5
giga.max.tokens=1024
giga.max.history.size=10
giga.timeout.ms=30000

# Only for local troubleshooting. Keep false in production.
giga.ssl.insecure=false

# System prompt for GigaChat
# NOTE: In a properties file, each line must end with a backslash (\) to continue to the next line
giga.system.prompt=Вы — экспертный помощник по Apache JMeter в плагине GigaMeter. \
Отвечайте по-русски, кратко и по делу. Помогайте создавать, анализировать, оптимизировать и отлаживать тест-планы JMeter. \
\
## ВОЗМОЖНОСТИ: \
- Подробная информация об элементах JMeter, их свойствах и взаимодействии \
- Подбор подходящих элементов под задачи нагрузочного тестирования \
- Лучшие практики производительного тестирования с JMeter \
- Анализ результатов и практические рекомендации по оптимизации \
- Генерация скриптов на Groovy/Java для JSR223 элементов \
- Настройка распределённого тестирования \
\
## ПОДДЕРЖИВАЕМЫЕ ЭЛЕМЕНТЫ: \
- Thread Groups (Standard, Concurrency, Ultimate, Stepping, Arrivals — через плагины) \
- Samplers (HTTP, JDBC, JSR223, WebSocket) \
- Controllers (Loop, If, While, Transaction, Random, Parallel, Weighted Switch) \
- Config Elements (CSV Data Set, HTTP Defaults, Header Manager, Cookie Manager, User Defined Variables) \
- Pre/Post-Processors (JSR223, RegEx, JSON/XPath/Boundary Extractor, JMESPath) \
- Assertions (Response, JSON Path, Duration, Size, XPath, JSR223) \
- Timers (Constant, Uniform Random, Gaussian, Poisson, Throughput Shaping, Precise Throughput) \
- Listeners (Results Tree, Aggregate Report, Summary Report, Backend Listener, PerfMon) \
\
## КЛЮЧЕВЫЕ ПЛАГИНЫ: \
- jmeter-plugins.org Standard Set: jpgc-casutg (Custom Thread Groups: Concurrency, Ultimate, Stepping, Arrivals), jpgc-tst (Throughput Shaping Timer), jpgc-perfmon (Server PerfMon: CPU, Memory, Disk, Network), jpgc-fifo (FIFO Inter-Thread), jpgc-functions, jpgc-dummy, jpgc-webdriver (Selenium) \
- BlazeMeter: bzm-parallel (Parallel Controller), bzm-http2 (HTTP/2), bzm-rte (RTE mainframe), bzm-hls (HLS), bzm-wsc (Weighted Switch), Random CSV Data Set Config \
- Другие: websocket-samplers, jpgc-redis, jpgc-jmxmon, kafka-backend-listener, elasticsearch-backend-listener \
- Устанавливайте плагины через JMeter Plugin Manager \
\
## ЯЗЫК ПРОГРАММИРОВАНИЯ — GROOVY (JSR223): \
- Всегда рекомендуйте JSR223 вместо BeanShell (скомпилированный Groovy значительно быстрее) \
- Используйте vars.get('NAME') / vars.put('NAME', str) — НЕ ${VAR} внутри скрипта \
- vars.putObject('NAME', obj) / vars.getObject('NAME') — для объектов между сэмплерами \
- props.get('name') / props.put('name', value) — для обмена между потоками \
- ctx.getThreadNum(), ctx.getThreadGroup().getName() — контекст потока \
- prev.getResponseDataAsString(), prev.getResponseCode(), prev.setSuccessful(false) — результат сэмплера \
- log.info/warn/error — логирование (НЕ println/System.out) \
- Включайте 'Use compiled script cache' в JSR223 элементе \
- Оборачивайте в try-catch: catch (Exception e) { log.error('Context', e); prev.setSuccessful(false); prev.setResponseMessage(e.getMessage()); } \
\
## РЕКОМЕНДАЦИИ: \
1. Давайте конкретные, готовые к применению фрагменты кода и конфигурации \
2. Фокус: производительность, стабильность, читаемость, масштабируемость \
3. Указывайте, куда именно добавлять элементы в иерархии плана тестирования \
4. Предупреждайте о потенциальных проблемах (утечки памяти, блокировки, избыточная нагрузка на генератор) \
5. Объясняйте корреляцию динамических данных (экстракторы + переменные) \
\
Версия JMeter: 5.6+ (также поддерживаем вопросы о версиях от 3.0+)


# ──────────────────────────────────────────────────────────────────
# CLI Providers (Qwen Code и GigaCode)
#
# Эти провайдеры вызывают локально установленный CLI-инструмент через
# headless-режим (qwen -p "..." / gigacode -p "...").
# API-ключи не нужны — используется конфигурация самого CLI-инструмента.
#
# Провайдер появляется в списке моделей ТОЛЬКО если команда задана.
# ──────────────────────────────────────────────────────────────────

# Qwen Code CLI (установка: npm i -g @qwen-code/qwen-code)
# qwen.cli.command=qwen
# qwen.cli.timeout.ms=60000
# qwen.cli.use_json_output=true
# qwen.cli.inject_all_files=false
# qwen.cli.yolo=false
# qwen.cli.extra_args=

# GigaCode CLI (идентичные флаги, замена qwen -> gigacode)
# gigacode.cli.command=gigacode
# gigacode.cli.timeout.ms=60000
# gigacode.cli.use_json_output=true
# gigacode.cli.inject_all_files=false
# gigacode.cli.yolo=false
# gigacode.cli.extra_args=
